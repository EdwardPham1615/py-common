[project]
name = "pycommon"
version = "0.1.0"
description = "Reusable platform library: config, logging, telemetry, security, storage, HTTP, runtime, persistence"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    # Already pulled in by pydantic-settings, but pycommon imports it directly
    # to read ENVIRONMENT out of .env before choosing which env files to load.
    "python-dotenv>=1.0.0",
    "structlog>=25.3.0",
    "ecs-logging>=2.2.0",
    "opentelemetry-api>=1.34.0",
    "anyio>=4.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.115.0",
    "starlette>=0.46.0",
    "httpx>=0.28.0",
]
storage = [
    "aioboto3>=14.0.0",
]
security = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.10.0",
]
telemetry = [
    "opentelemetry-sdk>=1.34.0",
    "opentelemetry-exporter-otlp>=1.34.0",
    "opentelemetry-instrumentation-fastapi>=0.55b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.55b0",
    "opentelemetry-instrumentation-redis>=0.55b0",
    "opentelemetry-instrumentation-pymongo>=0.55b0",
    "opentelemetry-instrumentation-celery>=0.55b0",
    "opentelemetry-instrumentation-httpx>=0.55b0",
    "opentelemetry-instrumentation-asgi>=0.55b0",
    "opentelemetry-instrumentation-grpc>=0.55b0",
    "fastapi>=0.115.0",
    "opentelemetry-exporter-prometheus>=0.55b0",
]
grpc = [
    "grpcio>=1.71.0",
    "opentelemetry-instrumentation-grpc>=0.55b0",
]
runtime = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "grpcio>=1.71.0",
]
persistence = [
    "sqlalchemy[asyncio]>=2.0.40",
    # DatabaseSettings.async_dsn hardcodes postgresql+asyncpg, so the extra that
    # provides the engine factory has to provide the driver it names. Without
    # this, create_engine_and_sessionmaker() raises ModuleNotFoundError at the
    # first call in a service that installed exactly what the README told it to.
    "asyncpg>=0.30.0",
]
migrations = [
    "alembic>=1.14.0",
    # build_alembic_config() sets sqlalchemy.url from sync_dsn (postgresql+psycopg).
    "psycopg[binary]>=3.3.4",
]
cache = [
    "redis>=5.0.0",
]
profiling = [
    "fastapi_profiler>=1.5.0",
]
all = [
    "pycommon[http,storage,security,telemetry,grpc,runtime,persistence,migrations,cache,profiling]",
]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.2.0",
    "aiosqlite>=0.21.0",
    "fakeredis[lua]>=2.29.0",
    # Starlette TestClient prefers httpx2 (StarletteDeprecationWarning otherwise).
    "httpx2>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycommon"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "C4",
    "PERF",
    "RUF",
    "ASYNC",
    "S",
    "PTH",
]
ignore = [
    "S101",
    "S104",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/security/**" = ["B008"]
"**/config/**" = ["S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
packages = ["pycommon"]

[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "alembic.*",
    "botocore.*",
    "ecs_logging.*",
    "grpc.*",
    "fastapi_profiler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: needs a real Redis (set REDIS_TEST_URL); skipped otherwise",
]

[tool.coverage.run]
source = ["src/pycommon"]
branch = true
# The integration suite is skipped without REDIS_TEST_URL. Leaving it in the
# measurement would make the same code look less covered on a laptop than in CI.
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# A floor, not a target. Set just under the current figure so an honest
# refactor does not fail the build, while a change that drops real coverage
# does. Raise it when the number rises; never lower it to make a build pass.
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
