name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only by default. Nothing here publishes anything, and a workflow that
# can write to the repo is a workflow an injected dependency can write with.
permissions:
  contents: read

# A new push makes the in-flight run for the same ref obsolete; cancelling it
# frees a runner instead of racing to report on code nobody is looking at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest

    # Real backing services for tests/integration. The rest of the suite runs on
    # substitutes that do not model what the code depends on: fakeredis does not
    # faithfully execute Lua, has no server-side TIME and does not really expire
    # keys; SQLite has no statement timeout, no timezone-aware timestamps and
    # coerces types asyncpg rejects. Credentials here are throwaway -- nothing in
    # a CI container is worth protecting, and a secret would only have to be
    # shared with every contributor.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # No health-cmd: the image has no shell tooling to run one. A wait step
      # below polls the query API from the runner instead.
      #
      # Pinned for the same reason every image here is: `latest` moving under a green
      # run is not a thing CI should be exposed to, and this image has failed to
      # come up before. Keep it in step with docker-compose.yaml.
      jaeger:
        image: jaegertracing/all-in-one:1.76.0
        env:
          COLLECTOR_OTLP_ENABLED: "true"
        ports: ["4317:4317", "16686:16686"]

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pycommon
          POSTGRES_PASSWORD: pycommon
          POSTGRES_DB: pycommon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pycommon -d pycommon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      OTLP_TEST_ENDPOINT: http://localhost:4317
      JAEGER_QUERY_URL: http://localhost:16686
      S3_TEST_ENDPOINT: http://localhost:4566
      S3_TEST_ACCESS_KEY: pycommon
      S3_TEST_SECRET_KEY: pycommon123
      POSTGRES_TEST_DSN: postgresql+asyncpg://pycommon:pycommon@localhost:5432/pycommon_test
      KEYCLOAK_TEST_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync
        run: uv sync --extra all --extra dev

      - name: Wait for Jaeger
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:16686/api/services >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Jaeger query API never became ready"
          exit 1

      # LocalStack provides S3, replacing MinIO. Every anonymous route to the
      # MinIO image is now closed: Docker Hub denied pulls in September 2025
      # (which is why this had moved to quay.io), and on 2026-09-26 quay.io began
      # answering `no such manifest` for the pinned tag and 401 for the
      # repository, failing this step and with it every test.
      #
      # A step rather than a service container, matching what MinIO did: keeping
      # the readiness wait here makes a slow start report itself with logs
      # attached instead of as an opaque job timeout.
      - name: Start LocalStack (S3)
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=s3 \
            localstack/localstack:4.9
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4566/_localstack/health \
              | grep -q '"s3": "available"' && exit 0
            sleep 2
          done
          echo "::error::LocalStack never reported s3 as available"
          docker logs localstack
          exit 1

      # Not a service container either, and for both of MinIO's reasons at once:
      # it needs a command (`start-dev --import-realm`) and it needs the realm
      # fixture from the checked-out tree mounted in. Client ids and secrets
      # live in that file rather than in this workflow, so the two cannot drift.
      #
      # Readiness is the realm's own discovery document, not /health/ready.
      # "The realm imported and is being served" is the condition the tests
      # actually need, where "the process is alive" is not -- and /health/ready
      # additionally needs KC_HEALTH_ENABLED and lives on management port 9000.
      # (That port used to clash with MinIO here; S3 now runs on 4566, so the
      # clash is gone but the reason above is not.) A cold import takes ~15-20s,
      # hence the longer budget.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/tests/integration/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.4 start-dev --import-realm
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/pycommon-test/.well-known/openid-configuration \
              >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Keycloak never served the pycommon-test realm"
          docker logs keycloak
          exit 1

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests *.md .github/*.md .github/ISSUE_TEMPLATE/*.md

      - name: Typecheck
        run: uv run mypy src/py_common

      # Coverage threshold lives in pyproject.toml, so this command and
      # `make test-cov` enforce the same number.
      # The two env vars above turn the integration suite on. Locally they are
      # unset and those tests skip, so `make test` stays offline;
      # `make test-integration` opts in.
      - name: Test
        run: uv run pytest --cov=py_common --cov-report=term-missing

  # A separate job because it needs a clean environment per extra, which the
  # lint-test job -- which installs `--extra all` up front -- structurally
  # cannot give it. That is exactly why 0.2.0 shipped four extras that could not
  # import the modules they promise: every test ran with every dependency
  # present.
  extras-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Each extra stands on its own
        run: ./scripts/check-extras-isolation.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      # Audits the resolved lockfile rather than the loosest versions the
      # constraints allow, so this reports what consumers would actually get.
      - name: Export locked dependencies
        run: >
          uv export --frozen --extra all --no-dev --no-emit-project
          --format requirements-txt -o requirements-audit.txt

      # A separate job: a vulnerability advisory is news about the world, not a
      # defect in the pull request, and it should not mask a lint or test result.
      - name: Audit dependencies
        run: uvx pip-audit --requirement requirements-audit.txt --disable-pip
