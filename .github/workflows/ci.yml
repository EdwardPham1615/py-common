name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only by default. Nothing here publishes anything, and a workflow that
# can write to the repo is a workflow an injected dependency can write with.
permissions:
  contents: read

# A new push makes the in-flight run for the same ref obsolete; cancelling it
# frees a runner instead of racing to report on code nobody is looking at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest

    # Real backing services for tests/integration. The rest of the suite runs on
    # substitutes that do not model what the code depends on: fakeredis does not
    # faithfully execute Lua, has no server-side TIME and does not really expire
    # keys; SQLite has no statement timeout, no timezone-aware timestamps and
    # coerces types asyncpg rejects. Credentials here are throwaway -- nothing in
    # a CI container is worth protecting, and a secret would only have to be
    # shared with every contributor.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # No health-cmd: the image has no shell tooling to run one. A wait step
      # below polls the query API from the runner instead.
      jaeger:
        image: jaegertracing/all-in-one:latest
        env:
          COLLECTOR_OTLP_ENABLED: "true"
        ports: ["4317:4317", "16686:16686"]

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pycommon
          POSTGRES_PASSWORD: pycommon
          POSTGRES_DB: pycommon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pycommon -d pycommon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      OTLP_TEST_ENDPOINT: http://localhost:4317
      JAEGER_QUERY_URL: http://localhost:16686
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: pycommon
      S3_TEST_SECRET_KEY: pycommon123
      POSTGRES_TEST_DSN: postgresql+asyncpg://pycommon:pycommon@localhost:5432/pycommon_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Sync
        run: uv sync --extra all --extra dev

      - name: Wait for Jaeger
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:16686/api/services >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Jaeger query API never became ready"
          exit 1

      # Not a service container: those cannot pass a command, and the MinIO
      # image needs `server /data`. Started as a step instead, published on the
      # runner where the tests already run.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pycommon -e MINIO_ROOT_PASSWORD=pycommon123 \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          echo "::error::MinIO never became ready"
          docker logs minio
          exit 1

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy src/pycommon

      # Coverage threshold lives in pyproject.toml, so this command and
      # `make test-cov` enforce the same number.
      # The two env vars above turn the integration suite on. Locally they are
      # unset and those tests skip, so `make test` stays offline;
      # `make test-integration` opts in.
      - name: Test
        run: uv run pytest --cov=pycommon --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # Audits the resolved lockfile rather than the loosest versions the
      # constraints allow, so this reports what consumers would actually get.
      - name: Export locked dependencies
        run: >
          uv export --frozen --extra all --no-dev --no-emit-project
          --format requirements-txt -o requirements-audit.txt

      # A separate job: a vulnerability advisory is news about the world, not a
      # defect in the pull request, and it should not mask a lint or test result.
      - name: Audit dependencies
        run: uvx pip-audit --requirement requirements-audit.txt --disable-pip
